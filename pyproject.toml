[project]
name = "agentic-harness-lab"
version = "0.1.0"
description = "Benchmark agentic coding harnesses and models on real coding tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # Imported directly by scripts/bench_run.py and case_service.py; declare it
    # explicitly instead of relying on the uvicorn[standard] transitive dep.
    "pyyaml>=6.0",
    "celery[redis]>=5.4",
    "docker>=7.1",
    # Runtime dep of the api service, not just tooling: promoting a staged skill
    # and the health drift check both call ml_python_base.skills_sync, whose
    # renderer imports jinja2 at module level. Dockerfile.api installs with
    # --no-dev, so keeping this in the dev group made those paths fail with
    # ModuleNotFoundError inside the container.
    "jinja2>=3.1",
]

# Optional: three trajectory scores (task completion, step efficiency, tool
# correctness). A lab without it is missing those three scores and behaves
# identically otherwise — the adapter returns no score rather than a zero, so
# nothing downstream reads "not installed" as "did badly".
[project.optional-dependencies]
deepeval = ["deepeval>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_python_base", "src/harness_lab_app"]

[tool.ruff]
# General Ruff configuration
line-length = 88
target-version = "py311"

# Directories to include and exclude
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "htmlcov",
]

[tool.ruff.lint]
# Enabled rule sets (compatible with Black, Flake8, isort, pyupgrade, bugbear)
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modernize Python syntax)
    "ARG",    # flake8-unused-arguments
    "C90",    # mccabe (cyclomatic complexity)
    "T20",    # flake8-print (catch forgotten prints)
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]

# Rules deliberately disabled
ignore = [
    "E501",   # line too long (the formatter handles it)
    "B008",   # do not perform function calls in argument defaults (idiomatic in FastAPI)
    "C901",   # too complex (tune the threshold per project needs)
    "W191",   # indentation contains tabs (the formatter handles it)
]

# Allow autofix for every enabled rule
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
# FastAPI resolves endpoint annotations at runtime (request-body parsing), so
# schema imports must stay outside TYPE_CHECKING blocks here.
"src/harness_lab_app/api.py" = ["TC001"]
"tests/**/*.py" = [
    "ARG001",
    "ARG002",  # pytest fixtures can look unused
    "TCH001",
    "TCH002",
    "TCH003",  # Do not require TYPE_CHECKING blocks in tests
]
# The skills sync CLI legitimately prints user-facing progress to stdout.
"src/ml_python_base/skills_sync/cli.py" = ["T201"]
# The harness lifecycle CLI prints user-facing progress to stdout (its interface).
"src/harness_lab_app/harness_lifecycle/cli.py" = ["T201"]
# Bootstrap/maintenance scripts are CLIs: stdout progress is their interface.
"scripts/*.py" = ["T201"]

[tool.ruff.lint.isort]
# Black-compatible configuration.
# The package is imported as `ml_python_base` (src-layout), so the import
# name — not the directory — is what isort must recognize as first-party.
known-first-party = ["ml_python_base"]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 10

[tool.ruff.format]
# Formatter configuration (Black-compatible)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
# Lenient baseline: catches obvious type errors without blocking the template.
python_version = "3.11"
files = ["src", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ['(^|/)__pycache__/']

[tool.pytest.ini_options]
# pytest configuration
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
# coverage configuration
source = ["src"]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
# Coverage reporting
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.uv.workspace]
members = [
    "workspace/tetris-v1-K-037",
]

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "pre-commit>=3.8.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "mypy>=1.11",
    # Pinned exactly to the ruff-pre-commit `rev` in .pre-commit-config.yaml.
    # Both must move together or import sorting will ping-pong between them.
    "ruff==0.14.10",
    # Notebook tooling. Nothing under src/, scripts/, or adapters/ imports these
    # — they exist for `make install` (registers the Jupyter kernel), the
    # `nbstripout notebooks/*.ipynb` step in `make format`/`make fix`, and
    # notebooks/base.ipynb itself. Keeping them out of `[project].dependencies`
    # means `uv sync --no-dev` (Dockerfile.api, Dockerfile.runner) no longer
    # pulls pandas and the full Jupyter stack into the runtime images.
    "pandas",
    "nbstripout>=0.7.0",
    "ipykernel",
]
