repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000']

  # Keep this rev in lockstep with the ruff version in the dev dependency group
  # (pyproject `[dependency-groups].dev`). A mismatch makes `make fix` and the
  # pre-commit hook disagree on import order and fight each other on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # Secret scanning. This repo legitimately contains token-shaped strings —
  # sanitizer test vectors and documented placeholders — so findings are
  # allowlisted in .gitleaks.toml rather than by disabling the hook.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Every commit is authored by the developer, never an AI agent: refuses an
  # agent identity (a stray `[user]` in .git/config) and AI co-author trailers.
  # Runs at the commit-msg stage, which `make setup-hooks` installs.
  - repo: local
    hooks:
      - id: commit-authorship
        name: commit authored by the developer, not an AI agent
        entry: python3 scripts/check_commit_authorship.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
