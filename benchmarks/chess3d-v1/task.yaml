files_forbidden:
  - benchmarks/chess3d-v1/grader/grade.py
  - benchmarks/chess3d-v1/grader/harvest.gd

constraints:
  - A Godot 4.7 project at the workspace root, GDScript only
  - Only the agent's own code and assets; no addons, plugins, GDExtension or binaries
  - The Compatibility renderer; a main scene that shows the board
  - Do not edit the shipped grader

success_criteria:
  level_0: no Godot project, or nothing that loads
  level_2: the Chess autoload exists with its contract, own code only, Compatibility renderer
  level_4: legal moves and shallow perft are right in ordinary positions
  level_6: every special rule (en passant, castling, pins, promotion, undo) and deep perft are exact
  level_7: SAN in and out, clocks, history, mate, stalemate and every draw rule are exact
  level_8: a 3D board renders, pieces stand where the engine says, and the mouse plays real chess
  level_9: the board follows the engine, promotes by click, names check and mate, and keeps its frame budget
  level_10: the computer finds forced mates in one and two and answers a mouse move on the board

# Exactly two variants (ADR-0047): the task, and the task plus the harness.
# `harness` is `_harness_preamble.md` concatenated onto `prompt_default.md`;
# regenerate with `make prompts`.
prompts:
  default: benchmarks/chess3d-v1/prompt_default.md
  harness: benchmarks/chess3d-v1/prompt_harness.md

scoring_rubric: benchmarks/chess3d-v1/scoring.md
