task_id: chess3d-v1
version: "1"
status: active
category: game-3d
tags: [godot, 3d, game, frontier, graded, ships-tests, own-image]

description: >
  Build a playable 3D chess game in Godot 4.7 — a rules engine that is exactly
  right, a 3D board played with the mouse, and a computer opponent — graded by a
  shipped grader against python-chess on positions generated for each run
  (ADR-0078). The first case of the 3D game lane: hard enough that only a
  frontier model is expected to reach the top of the ladder, and graded so that
  every rung below it is still measured.

subject_repo: ml-python-base
base_commit: 97338ea2747f24d49a6962fb07e2aa5f63f478b3

target_level: 10
complexity: frontier

# The case's own machine (ADR-0078). The agent and the grader run in the runner
# image with Godot; the Play and Desktop sandboxes open in the sandbox image with
# Godot. Build both with `make images-3d`. No other case uses them.
runner_image: harness-lab-runner-godot:latest
sandbox_image: harness-lab-sandbox-godot:latest
play_command: "godot --path /work -- --ai=black"
# Named in the prompt's location header instead of the pygame default main.py.
entry_point: project.godot

# The work is paced in five phases, one step each (ADR-0079). Phase 1 is the
# case prompt itself; these drive steps 2-5. Every phase is stored with the
# prompt's contract appended, and under the `harness` variant with the
# governance preamble prepended, because each step is a fresh agent session.
# The run cannot end itself before the last phase. Per-step reward then shows
# which milestone each model reached.
phases:
  - benchmarks/chess3d-v1/phases/phase-2-notation-and-game-end.md
  - benchmarks/chess3d-v1/phases/phase-3-board-and-mouse.md
  - benchmarks/chess3d-v1/phases/phase-4-computer-opponent.md
  - benchmarks/chess3d-v1/phases/phase-5-finish.md

# What grades the agent stays out of its container (ADR-0079): the grader, the
# rubric and the case notes. The validation lane still reads them. The lab's
# calibration references (data/reference/) are masked for every case.
agent_hidden:
  - benchmarks/chess3d-v1/grader/
  - benchmarks/chess3d-v1/scoring.md
  - benchmarks/chess3d-v1/README.md

validation: objective
validation_note: >
  The grader in benchmarks/chess3d-v1/grader/ is the grade. The first command is
  the tamper guard; the second generates this run's probes (seeded with the run
  id), runs the agent's project twice — rules headless, the scene on a software
  renderer — and stores the raw answers in <workspace>/.lab-grade/. It fails only
  when there is no Godot project. Each of the 39 checks after it is its own
  command, deciding one behaviour against python-chess, so test_pass_rate and the
  per-step reward have 39 steps of resolution. A check exits 124 (inconclusive)
  only when the lab could not measure it.

# The checks import python-chess, the independent rules engine every verdict is
# decided against. Installed into the run's own folder before the offline checks.
validation_requirements:
  - chess==1.11.2

validation_commands:
  - "git -C /app diff --quiet HEAD -- benchmarks/chess3d-v1/grader && test -z \"$(git -C /app status --porcelain -- benchmarks/chess3d-v1/grader)\""
  - "cd {workspace} && timeout 900 python /app/benchmarks/chess3d-v1/grader/grade.py harvest \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/chess3d-v1/grader/grade.py check contract \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/chess3d-v1/grader/grade.py check own_code \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/chess3d-v1/grader/grade.py check renderer \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/chess3d-v1/grader/grade.py check fen_roundtrip \"$PWD\" {run_id}"
