files_forbidden:
  - benchmarks/racing3d-v1/grader/grade.py
  - benchmarks/racing3d-v1/grader/harvest.gd

constraints:
  - A Godot 4.7 project at the workspace root, GDScript only
  - Only the agent's own code and assets; no addons, plugins, GDExtension or binaries
  - The Compatibility renderer, physics at 60 ticks per second, and a main scene
  - Do not edit the shipped grader

success_criteria:
  level_0: no Godot project, or nothing that loads
  level_2: the Race autoload exists with its contract, own code only, Compatibility renderer
  level_4: a track loads from data and a car with real physics accelerates, brakes and steers on it
  level_5: barriers hold, the car stays on the ground, the race is deterministic, bad files are refused
  level_7: checkpoints count in order, laps and lap times are exact, cuts and wrong way are caught
  level_8: respawn and the on-track and upside-down flags work; the input map and a default track ship
  level_9: a 3D scene with a chase camera and a HUD, driven by the keyboard actions, within the frame budget
  level_10: AI rivals drive the run's track, get around a stopped car without shoving it, and finish a lap of an unseen track without passing through any car

# Exactly two variants (ADR-0047): the task, and the task plus the harness.
# `harness` is `_harness_preamble.md` concatenated onto `prompt_default.md`;
# regenerate with `make prompts`.
prompts:
  default: benchmarks/racing3d-v1/prompt_default.md
  harness: benchmarks/racing3d-v1/prompt_harness.md

scoring_rubric: benchmarks/racing3d-v1/scoring.md
