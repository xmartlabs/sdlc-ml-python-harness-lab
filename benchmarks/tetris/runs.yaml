# Tetris v1 — declarative run registry.
# 5 cells (A–E) x 3 repetitions = 15 runs. Do NOT change prompts between runs of a cell.
# Fill base_commit before the first run. result_level/human_interventions stay empty until scored.
#
# Model notes:
#   gpt-5.5            -> gateway/gpt-5.5                       (real)
#   qwen3.6-35b        -> gateway/lmstudio-qwen3.6-35b-build    (real, output-capped build profile)
#   qwen3.5-9b         -> gateway/lmstudio-qwen3.5-9b  (LM Studio, openai/qwen/qwen3.5-9b)
#                         default temp 0.7; role alias qwen9b-executor uses 0.2 for execution

benchmark_id: tetris-v1
subject_repo: ml-python-base
base_commit: TBD            # freeze the ml-python-base sha here before the first run

