# Canonical harness regression suite (plan §12).
# Compares the installed governance baseline against a candidate release under
# controlled conditions. Thresholds live here — never hard-coded in Python.
schema_version: 1
suite_id: harness-regression-v1

execution:
  canary_repetitions: 3
  swebench_repetitions: 1
  sequential: true
  require_clean_harness: true

# Only cases that exist in the lab. The canaries the plan named
# (systematic-debugging-v1, documentation-update-v1) and the flask instance are
# not authored/imported yet; listing them made the suite fail silently at launch.
cases:
  - id: cli-textstats-v1
    role: simple-feature
    repetitions: 3
  - id: tetris-v2
    role: graded-build
    repetitions: 3

comparison:
  baseline: installed
  candidate: requested_ref
  controlled_fields:
    - case
    - prompt
    - executor_model
    - planner_model
    - temperature
    - max_steps
    - runner_image

# Hard gates block adoption. Thresholds are declarative.
gates:
  # A run of N or more consecutive normalized-equivalent commands is pathological.
  pathological_loop_threshold: 3
  # Deterministic canaries must pass this fraction of candidate repetitions.
  canary_pass_ratio: 1.0
  # No unplanned human intervention is allowed.
  max_interventions: 0

# Warnings never block; they surface regressions for review.
warnings:
  median_token_increase_pct: 20.0
  median_cost_increase_pct: 20.0
  median_duration_increase_pct: 20.0
  median_steps_increase_pct: 25.0
  composite_drop_max: 0.5
