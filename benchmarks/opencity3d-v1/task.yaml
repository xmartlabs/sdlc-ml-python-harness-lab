files_forbidden:
  - benchmarks/opencity3d-v1/grader/grade.py
  - benchmarks/opencity3d-v1/grader/harvest.gd

constraints:
  - A Godot 4.7 project at the workspace root, GDScript only
  - The city is built at runtime from the map file; any map in the format must load
  - Only the agent's own code and assets; no addons, plugins, GDExtension, binaries or downloaded models
  - The Compatibility renderer; a main scene with the city, a third-person camera, a minimap and the OpenStreetMap attribution
  - Do not edit the shipped grader

success_criteria:
  level_0: no Godot project, or nothing that loads
  level_2: the City autoload exists with its contract, own code only, Compatibility renderer, the input actions
  level_4: any map loads; buildings are built with the right count, ids, heights and placement, and bad maps are refused
  level_5: the built city is solid where the map says — roofs and streets by physics ray, true footprint shapes, rendered roofs match from above
  level_6: the player spawns on a street, teleports, walks and sprints, and walls stop them
  level_7: the main scene follows the player with a third-person camera and the keyboard walks
  level_8: cars are entered, driven, braked, steered and stopped by walls, by API and by keyboard
  level_9: ambient traffic drives the roads and never through buildings; the minimap tracks the player
  level_10: the whole game together — the attribution on screen, the frame budget kept on the full city

# Exactly two variants (ADR-0047): the task, and the task plus the harness.
# `harness` is `_harness_preamble.md` concatenated onto `prompt_default.md`;
# regenerate with `make prompts`.
prompts:
  default: benchmarks/opencity3d-v1/prompt_default.md
  harness: benchmarks/opencity3d-v1/prompt_harness.md

scoring_rubric: benchmarks/opencity3d-v1/scoring.md
