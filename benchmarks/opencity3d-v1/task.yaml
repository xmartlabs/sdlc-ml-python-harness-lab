task_id: opencity3d-v1
version: "1"
status: active
category: game-3d
tags: [godot, 3d, game, open-world, openstreetmap, frontier, graded, ships-tests, own-image]

description: >
  Build an open-world 3D city game in Godot 4.7, generated at runtime from real
  map data: Montevideo's Ciudad Vieja from OpenStreetMap, buildings extruded from
  their footprints to their heights, streets from road centrelines, a player who
  walks the city in third person and drives cars, ambient traffic that follows
  the roads, and a minimap. Graded by a shipped grader on a held-out
  neighbourhood generated for each run (ADR-0078), so the game must build any
  map in the format, not only the one it was given.

subject_repo: ml-python-base
base_commit: 97338ea2747f24d49a6962fb07e2aa5f63f478b3

target_level: 10
complexity: frontier

# The case's own machine (ADR-0078): the Godot runner and sandbox images, built
# with `make images-3d`.
runner_image: harness-lab-runner-godot:latest
sandbox_image: harness-lab-sandbox-godot:latest
play_command: "godot --path /work"
entry_point: project.godot

# The map the agent builds from, copied into the empty workspace before the
# agent runs (ADR-0068): {workspace}/data/ciudad-vieja.json. The grader keeps
# its own canonical copy in data/ and generates the held-out map from it.
starter: benchmarks/opencity3d-v1/starter

# Five phases, one step each (ADR-0079). Phase 1 is the case prompt itself.
phases:
  - benchmarks/opencity3d-v1/phases/phase-2-on-foot.md
  - benchmarks/opencity3d-v1/phases/phase-3-vehicles.md
  - benchmarks/opencity3d-v1/phases/phase-4-living-city.md
  - benchmarks/opencity3d-v1/phases/phase-5-finish.md

# What grades the agent stays out of its container (ADR-0079). The map data and
# the starter stay readable: the agent needs them.
agent_hidden:
  - benchmarks/opencity3d-v1/grader/
  - benchmarks/opencity3d-v1/scoring.md
  - benchmarks/opencity3d-v1/README.md

validation: objective
validation_note: >
  The grader in benchmarks/opencity3d-v1/grader/ is the grade. The first command
  is the tamper guard; the second builds this run's held-out map (a random,
  rotated, re-tagged window of the Ciudad Vieja extract, seeded with the run id)
  and its probes, runs the agent's project twice — the City API headless at a
  fixed 60 Hz, the scene on a software renderer — and stores the raw answers in
  <workspace>/.lab-grade/. It fails only when there is no Godot project. Each of
  the 44 checks after it is its own command, deciding one behaviour against the
  map file with plain geometry (point in polygon, distance to a centreline), so
  test_pass_rate and the per-step reward have 44 steps of resolution. A check
  exits 124 (inconclusive) only when the lab could not measure it.

validation_commands:
  - "git -C /app diff --quiet HEAD -- benchmarks/opencity3d-v1/grader && test -z \"$(git -C /app status --porcelain -- benchmarks/opencity3d-v1/grader)\""
  - "cd {workspace} && timeout 900 python /app/benchmarks/opencity3d-v1/grader/grade.py harvest \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/opencity3d-v1/grader/grade.py check contract \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/opencity3d-v1/grader/grade.py check own_code \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/opencity3d-v1/grader/grade.py check renderer \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/opencity3d-v1/grader/grade.py check input_actions \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/opencity3d-v1/grader/grade.py check default_map \"$PWD\" {run_id}"
  - "cd {workspace} && timeout 120 python /app/benchmarks/opencity3d-v1/grader/grade.py check heldout_loads \"$PWD\" {run_id}"
