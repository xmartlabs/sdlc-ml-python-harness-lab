# Single origin for the always-on lab (ADR-0019).
#
# The SPA and the API answer on the same host:port, so the session cookie needs
# no Domain, and the Origin check that session_middleware.py runs on mutating
# requests passes without special-casing (ADR-0015). The api service is not
# published to the LAN in prod — this proxy is the only way in.

upstream harness_lab_api {
    server api:8008;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Run artifacts and log tails are large; the default 1m rejects uploads of
    # a multi-file skill archive (Phase 4) well before the service's own caps.
    client_max_body_size 32m;

    # The API sets its own cache semantics; never let a proxy invent them.
    location /api/ {
        proxy_pass http://harness_lab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A benchmark run can hold a request open while it validates or scores.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers pinned to a stale bundle.
    # One header, not `expires` + `add_header` — that emits two Cache-Control
    # lines and leaves which one wins up to the client.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
